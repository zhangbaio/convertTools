<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>@@Title@@ · 第@@Episode@@集分镜</title>
<style>
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; height: 100vh; display: grid; grid-template-columns: 270px minmax(0, 1fr);
  color: #ecf2fa; background: #111924;
  font: 22px "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
}
aside {
  display: flex; flex-direction: column; gap: 54px; padding: 42px 24px;
  border-right: 1px solid #2c3848; background: #17212e;
}
.brand { display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 700; }
.mark { width: 20px; height: 20px; border-radius: 5px; background: #76d6c3; }
nav { display: grid; gap: 12px; }
button {
  cursor: pointer; font: inherit; text-align: left; border: 1px solid transparent;
  border-radius: 10px; padding: 14px 18px; color: #beccdd; background: transparent;
}
nav button[aria-pressed="true"] { background: #263e4a; border-color: #385a63; color: #a2ecdd; }
.source { margin-top: auto; display: grid; gap: 10px; font-size: 16px; color: #a5b5c8; }
.source strong { overflow-wrap: anywhere; color: #dde7f2; font-weight: 500; }
main { min-width: 0; padding: 38px 52px; }
header, .heading { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
header { padding-bottom: 27px; border-bottom: 1px solid #2c3848; }
header span { color: #a2ecdd; white-space: nowrap; }
h1 { margin: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 34px; }
h2 { margin: 0; font-size: 46px; }
section { padding-top: 40px; }
p { color: #a5b5c8; margin: 16px 0 30px; }
.shots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; }
figure { margin: 0; overflow: hidden; border: 1px solid #344459; border-radius: 14px; background: #1b2635; }
figure img { display: block; width: 100%; height: 515px; object-fit: contain; background: #0b121b; }
figcaption { display: flex; justify-content: space-between; gap: 10px; padding: 22px 20px; }
figcaption span { color: #a5b5c8; font-variant-numeric: tabular-nums; }
.graph {
  display: flex; align-items: center; justify-content: center; padding: 64px 32px; margin: 26px 0;
  border-radius: 14px; border: 1px solid #344459;
  background: radial-gradient(#314356 1.4px, transparent 1.4px) 0 0 / 20px 20px, #151f2c;
}
.node {
  display: grid; gap: 15px; min-width: 250px; padding: 25px;
  border: 1px solid #4f737e; border-radius: 10px; background: #243744;
}
.node span { font-size: 18px; color: #a2ecdd; }
.wire { width: 65px; border-top: 2px solid #76d6c3; }
.compact img { height: 315px; }
#play { color: #102420; background: #8fe0d0; font-weight: 700; }
video { display: block; margin-top: 24px; width: 100%; height: 710px; background: #0b121b; border-radius: 14px; }
.three-view aside { background: #182433; }
.three-view .mark { background: #9ebdff; }
.three-view nav button[aria-pressed="true"] { color: #d6e3ff; background: #2c4366; border-color: #496a9a; }
.three-view #play { color: #152b4e; background: #b4cbff; }
.split-view { width: 100%; margin-top: 26px; table-layout: fixed; border-spacing: 0 10px; }
.split-view th { text-align: left; color: #bdd0f8; background: #253754; padding: 13px 22px; }
.split-view td { vertical-align: middle; padding: 11px 22px; background: #1c293a; }
.split-view td:nth-child(2) { background: #22324a; border-inline: 3px solid #111924; }
.split-view td img { display: block; width: 100%; height: 174px; object-fit: contain; background: #0d1522; }
.split-view td strong { display: block; font-size: 24px; }
.split-view td span { display: block; color: #adbed5; margin-top: 12px; }
.split-view td button { margin-top: 12px; border-color: #4a6288; padding: 8px 14px; background: #293c59; }
.asset-empty { display: grid; place-content: center; height: 515px; background: #0b121b; color: #a5b5c8; }
.compact .asset-empty { height: 315px; }
.with-ai .node { min-width: 220px; }
figcaption span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prompt {
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5; overflow: hidden;
  overflow-wrap: anywhere; color: #d7e2f3; line-height: 1.45; font-size: 22px; margin: 0 20px 22px;
}
#storyboard figure:has(.prompt) img { height: 410px; }
.split-view .prompt { -webkit-line-clamp: 4; font-size: 20px; margin: 8px 0 0; }
</style>
</head>
<body class="@@Template@@@@AiClass@@">
  <aside>
    <div class="brand"><span class="mark"></span>短剧助手</div>
    <nav aria-label="分镜工作台">
      <button type="button" data-view="assets" aria-pressed="true">素材资产</button>
      <button type="button" data-view="canvas" aria-pressed="false">节点画布</button>
      <button type="button" data-view="storyboard" aria-pressed="false">剧集分镜</button>
    </nav>
    <div class="source"><span>来源视频</span><strong>@@Filename@@</strong></div>
  </aside>
  <main>
    <header><h1>@@Title@@</h1><span>第@@Episode@@集</span></header>
    <section id="assets">
      <h2>素材资产图</h2>
      <p>@@AssetNote@@</p>
      <div class="shots">@@AssetCards@@</div>
    </section>
    <section id="canvas" hidden>
      <h2>节点画布</h2>
      <div class="graph">@@Graph@@</div>
      <div class="shots compact">@@AssetCards@@</div>
    </section>
    <section id="storyboard" hidden>
      <div class="heading"><h2>第@@Episode@@集分镜</h2>
        <button type="button" id="play">播放拼接预览</button>
      </div>
      @@Storyboard@@
    </section>
    <section id="preview" hidden>
      <h2>分镜拼接预览</h2>
      <video id="preview-video" src="data:video/webm;base64,@@Video@@" muted loop playsinline preload="auto"></video>
    </section>
  </main>
  <script>
    const tabs = document.querySelectorAll("[data-view]");
    const views = document.querySelectorAll("main > section");
    const video = document.querySelector("#preview-video");
    let previewEnd = null;
    function show(view) {
      views.forEach(section => { section.hidden = section.id !== view; });
      tabs.forEach(tab => {
        tab.setAttribute("aria-pressed", String(tab.dataset.view === view));
      });
      if (view !== "preview") video.pause();
    }
    tabs.forEach(tab => tab.addEventListener("click", () => show(tab.dataset.view)));
    function play(offset, end = null) {
      show("preview");
      previewEnd = end;
      video.loop = end === null;
      video.currentTime = offset;
      video.play().catch(() => { /* 录屏任务会检查预览是否已播放。 */ });
    }
    video.addEventListener("timeupdate", () => {
      if (previewEnd !== null && video.currentTime >= previewEnd) video.pause();
    });
    document.querySelector("#play").addEventListener("click", () => play(0));
    document.querySelectorAll("[data-offset]").forEach(button => {
      button.addEventListener("click", () => play(Number(button.dataset.offset), Number(button.dataset.end)));
    });
    if (location.hash === "#preview") play(0);
  </script>
</body>
</html>
